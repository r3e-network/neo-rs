# cargo-deny configuration for neo-rs
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
# Include path-only workspace members so license checks see neo-benches / neo-tests.
exclude-dev = false

[advisories]
version = 2
yanked = "warn"
# Tracked dependency-debt advisories. Prefer upgrading warp/hyper/rand stacks
# over silent silence — IDs are listed so CI stays green while upgrades land.
ignore = [
    { id = "RUSTSEC-2026-0190", reason = "anyhow Error::downcast_mut unsound; no consensus use of downcast_mut on context-wrapped errors" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; migration tracked with serialization cleanup" },
    { id = "RUSTSEC-2026-0258", reason = "h2 empty DATA frames; pulled via hyper 0.14/warp; upgrade with HTTP stack migration" },
    { id = "RUSTSEC-2026-0002", reason = "hashbrown/related IterMut stacked borrows; transitive; monitored" },
    { id = "RUSTSEC-2026-0253", reason = "lru pop panic safety; limited exposure in inventory caches" },
    { id = "RUSTSEC-2026-0097", reason = "rand custom logger; node does not install a rand-using logger callback" },
    { id = "RUSTSEC-2023-0071", reason = "legacy advisory id placeholder if resurfaced via rustls-pemfile unmaintained chain" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
