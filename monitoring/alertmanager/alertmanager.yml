route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'neo-team'
  routes:
    - match:
        severity: critical
      receiver: 'neo-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'neo-warning'

receivers:
  - name: 'neo-team'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'neo-critical'
    # Configure your critical alert channels here
    # Examples: PagerDuty, Slack, email, etc.
    webhook_configs:
      - url: 'http://localhost:5001/critical'
        send_resolved: true
    # email_configs:
    #   - to: 'oncall@neo.org'
    #     from: 'alerts@neo.org'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alerts@neo.org'
    #     auth_password: 'password'
    #     headers:
    #       Subject: '[CRITICAL] Neo N3 Alert: {{ .GroupLabels.alertname }}'

  - name: 'neo-warning'
    # Configure your warning alert channels here
    webhook_configs:
      - url: 'http://localhost:5001/warning'
        send_resolved: true
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#neo-alerts'
    #     title: '[WARNING] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
