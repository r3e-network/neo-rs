[package]
name = "neo-wallets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Wallet primitives: BIP-32 key paths and BIP-39 mnemonics for neo-rs"

[dependencies]
# Internal crates (registered in workspace.dependencies)
neo-primitives = { workspace = true }
neo-protocol = { workspace = true }
neo-crypto = { workspace = true }
neo-io = { workspace = true }
neo-vm = { workspace = true }
neo-storage = { workspace = true }

# Internal crates (registered by task 89; path deps like the other consumers)
neo-smart-contract = { workspace = true }
neo-native-contracts = { workspace = true }

# Serialization / error handling
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Async support
async-trait = { workspace = true }
tokio = { workspace = true }

# Transaction / fee construction helpers
num-bigint = { workspace = true }
rand = { workspace = true }

# Encoding and constant-time helpers
base64 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }

# BIP-39 mnemonics and secret zeroization
bip39 = { workspace = true }
zeroize = { workspace = true }

# NEP-2 crypto (scrypt KDF + AES-256-CBC). Pinned with explicit versions to
# match neo-core's declaration style; not centralized in workspace.dependencies.
aes = "0.8"
cbc = "0.1"
scrypt = "0.11"

[features]
# Aggregate gate so `neo-wallets` participates in the workspace-wide
# `--features full` build and the per-crate acceptance check. The crate has no
# optional dependencies, so this enables no additional functionality.
full = []

[lints]
workspace = true
