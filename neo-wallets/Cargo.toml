[package]
name = "neo-wallets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Wallet primitives: BIP-32 key paths and BIP-39 mnemonics for neo-rs"

[features]
default = ["remote"]
# Phase 9 (F14): the outbound HTTP/TLS remote-signer transport
# (`signing::remote_client`, the only `reqwest` consumer) plus the chain-backed
# helpers that ship alongside it. Disabling it (`--no-default-features`) keeps
# the wallet core — keys, accounts, NEP-2/NEP-6, signing-service contracts —
# fully usable without linking a TLS stack. It stays on by default so existing
# consumers (neo-node, neo-system, neo-rpc-client, ...) are unaffected.
remote = ["dep:reqwest"]

[dependencies]
# Internal crates (registered in workspace.dependencies)
neo-primitives = { workspace = true }
neo-protocol = { workspace = true }
neo-crypto = { workspace = true }
neo-io = { workspace = true }
neo-vm = { workspace = true }
neo-storage = { workspace = true }
neo-native-contracts = { workspace = true }

# Internal crates (registered by task 89; path deps like the other consumers)
neo-smart-contract = { workspace = true }

# Serialization / error handling
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async support
async-trait = { workspace = true }
tokio = { workspace = true }

# Phase 3 S6a: dedicated mTLS remote-signer transport (signing::remote_client).
# rustls-tls mirrors the node's reqwest feature selection (platform roots are
# deliberately disabled by the transport itself). Optional since Phase 9 (F14):
# activated by the `remote` feature so a core-only wallet build links no TLS.
reqwest = { workspace = true, features = ["rustls-tls"], optional = true }

# Transaction / fee construction helpers
num-bigint = { workspace = true }
rand = { workspace = true }

# Encoding and constant-time helpers
base64 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true }

# BIP-39 mnemonics and secret zeroization
bip39 = { workspace = true }
zeroize = { workspace = true }

# Utilities
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

# NEP-2 crypto (scrypt KDF + AES-256-CBC). Pinned with explicit versions to
# match neo-core's declaration style; not centralized in workspace.dependencies.
aes = "0.8"
cbc = "0.1"
scrypt = "0.11"

[dev-dependencies]
chrono = { workspace = true }
# Phase 3 S6a: local HTTP fault-injection servers in remote_client tests. Those
# tests are `cfg(feature = "remote")`, so this edge is inert in a core-only run.
hyper = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
