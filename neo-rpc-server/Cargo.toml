[package]
name = "neo-rpc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "RPC server, application logs, and token tracker for Neo blockchain"

[dependencies]
# Internal crates
# Phase 2 S5: shared RPC vocabulary (models/serialization/error) comes from
# the extracted client crate; the server keeps the heavy system/ledger face.
neo-rpc-client = { path = "../neo-rpc-client" }
neo-primitives = { workspace = true }
neo-crypto = { workspace = true }
neo-io = { workspace = true }
# `application_logs` and `tokens_tracker` bind directly to these leaf crates
# (task 134, D3=a; task 140).
neo-storage = { workspace = true }
neo-ledger = { workspace = true }
neo-protocol = { workspace = true }
# Task 206: the RPC server actor relay binds directly to neo-actors instead of
# the neo-core `runtime` compatibility re-export (same types, TypeId-preserving).
neo-actors = { workspace = true }
neo-smart-contract = { workspace = true }
# Task 153: `NeoSystem` is consumed through the `neo_system::*` facade, which
# re-exports the canonical `neo_core::neo_system` surface (same types), so the
# RPC server/session code no longer needs to name neo-core for it.
neo-system = { workspace = true }
# Phase 1 S1: P2P surface bound directly from the extracted crate.
neo-p2p = { workspace = true }
# Phase 1 S3: state-service surface bound directly from the extracted crate.
neo-state-service = { workspace = true }
neo-json = { path = "../neo-json" }
# Wallet primitives (task D4): server RPC endpoints bind to neo-wallets directly.
neo-wallets = { workspace = true }
# Native contracts are used by RPC server for GAS, NEO, and other native contract interactions
neo-native-contracts = { workspace = true }
# `application_logs` and `tokens_tracker` bind directly to the VM, so neo-vm
# is a non-optional dependency (task 140).
neo-vm = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { version = "0.7" }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Web server
warp = { version = "0.3", features = ["compression-gzip"] }
hyper = { workspace = true }
# Updated to 0.26.0 to resolve indexmap version conflicts (tower dependency)
jsonrpsee = { version = "0.26.0", optional = true, default-features = false, features = ["server"] }

# TLS
tokio-rustls = { version = "0.24" }
rustls = { version = "0.21" }
rustls-native-certs = { version = "0.6" }
p12 = { version = "0.6" }
sha1 = { version = "0.10" }

# Rate limiting
dashmap = { workspace = true }
governor = { workspace = true }

# Utilities
uuid = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
hex = { workspace = true }
socket2 = { workspace = true }

# Cryptography
rand = { workspace = true }
zeroize = { workspace = true }
subtle = { version = "2.5" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
jsonrpsee-server = ["dep:jsonrpsee"]

[lints]
workspace = true