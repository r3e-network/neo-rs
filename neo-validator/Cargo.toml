[package]
name = "neo-validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
readme.workspace = true
description = "Fail-closed online state validator and RPC safety gateway for neo-cli and neo-go"

[features]
default = ["rocksdb"]
rocksdb = ["neo-storage/rocksdb"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
http-body = "0.4"
hyper.workspace = true
neo-crypto.workspace = true
neo-io.workspace = true
neo-ledger.workspace = true
neo-native-contracts.workspace = true
neo-primitives.workspace = true
neo-protocol.workspace = true
neo-storage.workspace = true
neo-system.workspace = true
neo-vm.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
