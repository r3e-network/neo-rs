[package]
name = "neo-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "RPC facade re-exporting neo-rpc-client and neo-rpc-server"

[dependencies]
# Phase 2 S5: the implementation lives in two extracted crates. This facade
# freezes every historical neo_rpc::* path (single definitions, TypeId-safe).
# The client crate is non-optional because the ungated shared error/error_code
# vocabulary lives there; the server crate stays behind the `server` feature.
neo-rpc-client = { path = "../neo-rpc-client" }
neo-rpc-server = { path = "../neo-rpc-server", optional = true }

[features]
default = []
# Compatibility alias kept for historical consumers (`features = ["client"]`);
# the client surface is always available via the non-optional dependency.
client = []
server = [
    "client",
    "dep:neo-rpc-server",
]
jsonrpsee-server = [
    "server",
    "neo-rpc-server/jsonrpsee-server",
]
# Aggregate feature so `cargo check -p neo-rpc --features full` builds the same
# surface as the workspace build (where `neo-node` enables `neo-rpc/server`).
full = ["server"]

[lints]
workspace = true