version: '3.8'

services:
  # Neo-N3 Node (optimized)
  neo-node:
    image: r3e/neo-rs-node:testnet-optimized
    container_name: neo-node
    restart: unless-stopped
    ports:
      - "20332:20332"  # RPC
      - "20333:20333"  # P2P
    volumes:
      - ./data/testnet:/neo-rs/data/testnet
      - ./config/testnet-production.toml:/neo-rs/config/testnet-production.toml
      - ./logs:/neo-rs/logs
    environment:
      - NODE_ENV=production
    networks:
      - neo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

  # Prometheus metrics collector
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - neo-network
    depends_on:
      - neo-node
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Alertmanager for notifications
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./config/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-data:/alertmanager
    environment:
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - neo-network
    depends_on:
      - prometheus

  # Grafana dashboard
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./config/grafana/neo-node-dashboard.json:/etc/grafana/provisioning/dashboards/neo-node.json:ro
    networks:
      - neo-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", 'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  neo-network:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
