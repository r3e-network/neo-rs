[package]
name = "neo-benches"
version = "0.22.0"
edition = "2024"
license = "MIT"

[features]
# Must forward to neo-storage: the RocksDB provider (and the `rocksdb` crate
# itself) only exist when neo-storage's own `rocksdb` feature is active.
rocksdb = ["neo-storage/rocksdb"]

[dependencies]
criterion = { workspace = true, features = ["html_reports"] }
neo-smart-contract = { workspace = true }
neo-crypto = { workspace = true }
neo-io = { workspace = true }
neo-native-contracts = { workspace = true }
neo-primitives = { workspace = true }
neo-protocol = { workspace = true }
# `rocksdb` is forwarded from this package's `rocksdb` feature to
# `neo-storage/rocksdb`; the crate itself stays a plain dependency because
# every other benchmark uses the in-memory store.
neo-storage = { workspace = true }
neo-mempool = { workspace = true }
neo-system = { workspace = true }
neo-vm = { workspace = true }
neo-wallets = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile.workspace = true
hex = { workspace = true }

# Bench names match what is actually measured (review §4.3.5); the file
# names are kept for history.
[[bench]]
name = "payload_serialization"
path = "benches/block_processing.rs"
harness = false

[[bench]]
name = "hashing"
path = "benches/state_root.rs"
harness = false

[[bench]]
name = "vm_execution"
harness = false

[[bench]]
name = "native_contracts"
path = "benches/native_contracts.rs"
harness = false

[[bench]]
name = "mpt_state_root"
path = "benches/mpt_state_root.rs"
harness = false

[[bench]]
name = "p2p_frames"
path = "benches/p2p_frames.rs"
harness = false

[[bench]]
name = "block_persistence"
path = "benches/block_persistence.rs"
harness = false

[[bench]]
name = "execution_modes"
path = "benches/execution_modes.rs"
harness = false

[[bench]]
name = "mempool_preverify"
path = "benches/mempool_preverify.rs"
harness = false

[[bench]]
name = "rocksdb_persistence"
path = "benches/rocksdb_persistence.rs"
harness = false
required-features = ["rocksdb"]

[lints]
workspace = true
