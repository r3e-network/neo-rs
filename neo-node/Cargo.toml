[package]
name = "neo-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Neo N3 blockchain node daemon"

[[bin]]
name = "neo-node"
path = "src/main.rs"

[features]
default = []
full = ["neo-storage/rocksdb"]
# Enable profiling support (metrics always available, full profiling on Unix with profiling-full)
profiling = []
# Full profiling with CPU profiler (Unix only, requires pprof)
profiling-full = ["profiling", "pprof", "tracing-timing", "tracing-flame"]
# Enable TEE (Trusted Execution Environment) support
tee = ["neo-tee"]
# Enable TEE with SGX hardware
tee-sgx = ["tee", "neo-tee/sgx-hw"]
# Enable HSM (Hardware Security Module) support
hsm = ["dep:neo-hsm", "dep:rpassword"]
# Enable HSM with Ledger hardware wallet
hsm-ledger = ["hsm", "neo-hsm/ledger"]
# Enable HSM with PKCS#11 interface
hsm-pkcs11 = ["hsm", "neo-hsm/pkcs11"]

[dependencies]
# Task 206: consensus binds directly to neo-actors instead of the neo-core
# `runtime` compatibility re-export (same types, TypeId-preserving).
neo-actors = { workspace = true }
# Task 175: bind directly to neo-native-contracts instead of neo-core::smart_contract::native.
neo-native-contracts = { workspace = true }
# Task 177: bind directly to neo-smart-contract instead of neo-core::smart_contract re-exports.
neo-smart-contract = { workspace = true }
neo-consensus = { path = "../neo-consensus" }
neo-p2p = { path = "../neo-p2p" }
neo-crypto = { path = "../neo-crypto" }
neo-vm = { workspace = true }
# Task 156: bind directly to the canonical foundation crates instead of the
# neo-core compatibility re-exports (pure `pub use` paths only).
neo-primitives = { workspace = true }
neo-protocol = { workspace = true }
neo-io = { workspace = true }
neo-storage = { workspace = true }
neo-rpc = { path = "../neo-rpc", features = ["server"] }
neo-telemetry = { workspace = true }
neo-ai-agent = { path = "../neo-ai-agent" }
neo-probe = { workspace = true }
# Signing authority (task 142): consumers bind to neo-signing, not neo-core::signing.
neo-signing = { workspace = true }
# System runtime (task 157): consumers bind to neo-system, not neo-core::neo_system.
# The neo-system crate re-exports the identical canonical types (TypeId-preserving).
# Task 208: enable the state root verification service moved from neo-core.
neo-system = { workspace = true, features = ["state-verifier"] }
# State service (task 176): consumers bind to neo-state-service directly.
neo-state-service = { workspace = true }
# Canonical memory pool (task 179 / C-1): consumers bind to neo-mempool
# directly instead of the neo-core compatibility re-export.
neo-mempool = { workspace = true }
# Wallet primitives (task D4): consumers bind to neo-wallets directly.
neo-wallets = { workspace = true }

# TEMPORARILY DISABLED: neo-plugins being refactored
# neo-plugins = { path = "../neo-plugins" }
neo-tee = { path = "../neo-tee", optional = true }
neo-hsm = { path = "../neo-hsm", optional = true }

# PIN input for HSM
rpassword = { version = "7.3", optional = true }

# Logging
env_logger = "0.10"

# Async channels
futures = { workspace = true }
async-trait.workspace = true
zeroize = { workspace = true }

# CLI and configuration
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
toml.workspace = true
hex.workspace = true
prometheus = { workspace = true }
parking_lot = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["process", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
hyper.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Utilities
chrono.workspace = true
sysinfo.workspace = true
rand = { workspace = true }
url = { workspace = true }
num_cpus = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
base64 = { workspace = true }
dashmap = { workspace = true }
bincode = { workspace = true }

# Profiling support
tracing-timing = { workspace = true, optional = true }
tracing-flame = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# pprof only works on Unix platforms
pprof = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
num-bigint = { workspace = true }

[lints]
workspace = true
