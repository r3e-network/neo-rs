[package]
name = "neo-tee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "TEE sealing, attestation, wallet and fair-ordering support for Neo N3"

[lib]
path = "src/mod.rs"

[features]
default = ["integration"]
# Phase 3 S6c / Phase 9 (F14): gates the runtime + wallet_adapter modules that
# sank from neo-node (formerly its `tee` feature) *and* the integration-only
# crate edges they need (neo-wallets / neo-protocol / neo-smart-contract).
# On by default so downstream consumers keep the pre-Phase-9 build surface;
# `--no-default-features` yields core TEE only (sealing, attestation, mempool)
# with no wallet or protocol vocabulary linked.
integration = ["dep:neo-wallets", "dep:neo-protocol", "dep:neo-smart-contract"]
tee-sgx = ["dep:sgx-isa"]
attestation = ["tee-sgx"]
# C-2: compiles the software (simulated) sealing-key derivation into a build
# without `tee-sgx`. The key is recomputable by any host process, so this must
# never be a default feature and must never be enabled by a `[dependencies]`
# edge: downstream crates opt in from `[dev-dependencies]` only, which under
# resolver 2 keeps it out of every non-test build. Without it (and without
# `tee-sgx`) `TeeEnclave::initialize` fails closed; see
# `tests/sealing_fail_closed.rs`.
tee-sgx-sim = []

[dependencies]
neo-crypto = { workspace = true }
neo-primitives = { workspace = true }
# Phase 3 S6c / Phase 9 (F14): wallet adapter binds the wallet/protocol/contract
# vocabulary directly (TypeId-preserving move, same rationale as neo-hsm).
# Optional: only the `integration` feature activates these edges.
neo-wallets = { workspace = true, optional = true }
neo-protocol = { workspace = true, optional = true }
neo-smart-contract = { workspace = true, optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hkdf = "0.12"
aes-gcm = "0.10"
zeroize = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
libloading = "0.8"
sgx-isa = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: wallet witness tests use OpCode.
neo-vm = { workspace = true }

[lints]
workspace = true
