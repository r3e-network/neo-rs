name: MainNet validation

permissions:
  contents: read

# This bounded differential job needs pre-downloaded RPC blocks and matching C#
# state-root output. It replaces the removed neo-core RocksDB repro tests with
# the canonical state-root-diff execution pipeline. It does not claim raw
# RocksDB integrity validation or an unbounded full-chain replay.
on:
  workflow_dispatch:
    inputs:
      blocks_file:
        description: Genesis-to-tip RPC block JSON produced by block_downloader.py
        required: true
        default: data/mainnet-blocks.json
      csharp_state_roots:
        description: Matching C# state-root JSON for the same contiguous blocks
        required: true
        default: data/csharp-state-roots.json
      expected_end_height:
        description: Required final height; the input must start at genesis
        required: true
        default: "1000"

concurrency:
  group: mainnet-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay-and-roots:
    name: MainNet replay and C# state-root differential
    runs-on: [self-hosted, neo-mainnet-data]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libbz2-dev libclang-dev liblz4-dev \
            librocksdb-dev libsnappy-dev libssl-dev libzstd-dev pkg-config \
            python3 python3-venv zlib1g-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check bounded validation data
        env:
          BLOCKS_FILE: ${{ inputs.blocks_file }}
          CSHARP_STATE_ROOTS: ${{ inputs.csharp_state_roots }}
          EXPECTED_END_HEIGHT: ${{ inputs.expected_end_height }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          end = int(os.environ["EXPECTED_END_HEIGHT"])
          if end < 0:
              raise SystemExit("expected end height must be non-negative")
          blocks_path = Path(os.environ["BLOCKS_FILE"])
          csharp_path = Path(os.environ["CSHARP_STATE_ROOTS"])
          if not blocks_path.is_file():
              raise SystemExit(f"missing block fixture: {blocks_path}")
          if not csharp_path.is_file():
              raise SystemExit(f"missing C# state roots: {csharp_path}")

          blocks_file = json.loads(blocks_path.read_text(encoding="utf-8"))
          if blocks_file.get("network", "").lower() != "mainnet":
              raise SystemExit("block fixture network must be mainnet")
          if blocks_file.get("start_height") != 0 or blocks_file.get("end_height") != end:
              raise SystemExit(f"block fixture must cover exactly 0..{end}")
          blocks = blocks_file.get("blocks", [])
          if blocks_file.get("block_count") != end + 1 or len(blocks) != end + 1:
              raise SystemExit("block count does not match the requested range")
          if [block.get("height") for block in blocks] != list(range(end + 1)):
              raise SystemExit("block fixture is not contiguous from genesis")

          csharp_file = json.loads(csharp_path.read_text(encoding="utf-8"))
          csharp_roots = {root.get("height"): root for root in csharp_file.get("state_roots", [])}
          for block in blocks:
              height = block["height"]
              reference = csharp_roots.get(height)
              if reference is None:
                  raise SystemExit(f"C# state root is missing at height {height}")
              if reference.get("block_hash", "").lower() != block.get("hash", "").lower():
                  raise SystemExit(f"C#/RPC block hash mismatch at height {height}")
          PY

      - name: Build canonical state-root replay tool
        run: cargo build --locked -p state-root-diff

      - name: Replay all supplied blocks from genesis
        env:
          BLOCKS_FILE: ${{ inputs.blocks_file }}
        run: |
          mkdir -p reports/mainnet
          cargo run --locked -p state-root-diff -- \
            "$BLOCKS_FILE" reports/mainnet/rust-state-roots.json

      - name: Compare every Rust and C# state root
        env:
          CSHARP_STATE_ROOTS: ${{ inputs.csharp_state_roots }}
        run: |
          python3 tools/state-root-diff/diff_state_roots.py \
            reports/mainnet/rust-state-roots.json \
            "$CSHARP_STATE_ROOTS" \
            reports/mainnet/state-root-differential.md

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-state-root-differential-${{ inputs.expected_end_height }}
          path: reports/mainnet/
          if-no-files-found: error
          retention-days: 14
