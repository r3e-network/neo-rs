name: Neo v3.10.1 Consistency

permissions:
  contents: read
  actions: write

# Auto-triggers (schedule / push / PR) are intentionally disabled:
# this workflow has never passed (0/9 runs as of 2026-09-10) because the
# repo variable NEO_EXECUTION_SPECS_REF is not configured — every run
# fails in minutes and burns CI minutes. Re-enable triggers ONLY after
# setting that variable (Settings -> Secrets and variables -> Actions ->
# Variables) to an immutable v3.10.1 tag or commit SHA. Manual dispatch
# remains available.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Network to validate
        required: false
        type: choice
        options:
        - all
        - mainnet
        - testnet
        default: all
      skip_baseline:
        description: Skip C# vs NeoGo baseline check
        required: false
        type: boolean
        default: false
      profile:
        description: Cargo profile
        required: false
        type: choice
        options:
        - dev
        - release
        default: dev
      vector_gas_tolerance:
        # Review §4.3.4: the scheduled/PR lanes keep the environment
        # tolerance for online probes. Dispatch with `0` to run the
        # exact-vector mode — per-unit gas equality, no tolerance — which
        # is the gate conformance claims must be measured against.
        description: Max allowed gas delta per vector (0 = exact match)
        required: false
        type: string
        default: "1000000"
jobs:
  consistency:
    name: ${{ matrix.network }} consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        network:
        - mainnet
        - testnet
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install system dependencies
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\
        \n  build-essential \\\n  clang \\\n  cmake \\\n  curl \\\n  jq \\\n  libbz2-dev\
        \ \\\n  libclang-dev \\\n  liblz4-dev \\\n  librocksdb-dev \\\n  libsnappy-dev\
        \ \\\n  libssl-dev \\\n  libzstd-dev \\\n  pkg-config \\\n  python3 \\\n \
        \ python3-pip \\\n  python3-venv \\\n  zlib1g-dev\n"
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Run Neo v3.10.1 consistency validation
      env:
        TARGET_NETWORK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.network
          || 'all' }}
        PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile
          || 'dev' }}
        SKIP_BASELINE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_baseline
          || 'false' }}
        VECTOR_GAS_TOLERANCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.vector_gas_tolerance
          || '1000000' }}
        # Pin this to the reviewed v3.10.1 execution-specs commit/tag.
        #
        # IMPORTANT (verified 2026-09-10): the upstream repo
        # r3e-network/neo-execution-specs has NO v3.10.1 tag -- it only carries
        # v0.1.1 and v0.1.2 -- and its latest commits target v3.10.0. So this
        # variable must be set to a full 40-char commit SHA, not a tag name.
        # `main`/`master` are rejected on purpose: they are moving refs and would
        # silently change what "conformance" means between runs.
        #
        # The script deliberately refuses to guess a default here. Resolve the SHA
        # with:  git ls-remote https://github.com/r3e-network/neo-execution-specs.git main
        #
        # NOTE: this gate remains UNVALIDATED -- it has never completed a run, so
        # configuring the variable is necessary but not sufficient.
        NEO_EXECUTION_SPECS_REF: ${{ vars.NEO_EXECUTION_SPECS_REF }}
        ALLOW_POLICY_DEFAULT_VECTOR_MISMATCH: 'false'
      run: "if [ \"$TARGET_NETWORK\" != \"all\" ] && [ \"$TARGET_NETWORK\" != \"${{\
        \ matrix.network }}\" ]; then\n  echo \"Skipping matrix lane '${{ matrix.network\
        \ }}' for requested network '$TARGET_NETWORK'\"\n  exit 0\nfi\n\nargs=(--network\
        \ \"${{ matrix.network }}\" --profile \"$PROFILE\")\nif [ \"$SKIP_BASELINE\"\
        \ = \"true\" ]; then\n  args+=(--skip-baseline)\nfi\n\nbash scripts/validate-v3101-consistency.sh\
        \ \"${args[@]}\"\n"
    - name: Upload consistency artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v3101-consistency-${{ matrix.network }}
        path: reports/compat-v3101/**
        retention-days: 14
