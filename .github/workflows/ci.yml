name: CI
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Reclaim runner disk space
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        sudo docker image prune -af || true

        '
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: build-essential clang cmake libbz2-dev libclang-dev liblz4-dev librocksdb-dev
          libsnappy-dev libssl-dev libzstd-dev pkg-config zlib1g-dev
        version: 1.0
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.7
      continue-on-error: true
    - name: Enable sccache (best-effort)
      run: "if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null;\
        \ then\n  echo \"RUSTC_WRAPPER=sccache\" >> \"$GITHUB_ENV\"\n  echo \"SCCACHE_GHA_ENABLED=true\"\
        \ >> \"$GITHUB_ENV\"\n  echo \"::notice::sccache enabled\"\nelse\n  echo \"\
        ::warning::sccache unavailable — falling back to direct compilation\"\nfi\n"
    - name: Cache cargo registry & git
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-lint
    - name: Clippy
      run: "cargo clippy --workspace --all-targets --profile test -- \\\n  -D clippy::all\
        \ \\\n  -A clippy::doc_overindented_list_items \\\n  -A clippy::doc_lazy_continuation\
        \ \\\n  -A clippy::large_enum_variant \\\n  -A clippy::module_inception \\\
        \n  -A clippy::type_complexity \\\n  -A clippy::len_zero \\\n  -A clippy::nonminimal_bool\
        \ \\\n  -A clippy::enum_variant_names \\\n  -A clippy::too_many_arguments\
        \ \\\n  -A clippy::field_reassign_with_default \\\n  -A clippy::assertions_on_constants\n"
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Reclaim runner disk space
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        sudo docker image prune -af || true

        '
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: build-essential clang cmake libbz2-dev libclang-dev liblz4-dev librocksdb-dev
          libsnappy-dev libssl-dev libzstd-dev pkg-config zlib1g-dev
        version: 1.0
    - uses: dtolnay/rust-toolchain@stable
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.7
      continue-on-error: true
    - name: Enable sccache (best-effort)
      run: "if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null;\
        \ then\n  echo \"RUSTC_WRAPPER=sccache\" >> \"$GITHUB_ENV\"\n  echo \"SCCACHE_GHA_ENABLED=true\"\
        \ >> \"$GITHUB_ENV\"\n  echo \"::notice::sccache enabled\"\nelse\n  echo \"\
        ::warning::sccache unavailable — falling back to direct compilation\"\nfi\n"
    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest
    - name: Cache cargo registry & git
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-test
    - name: Build tests
      run: cargo test --workspace --no-run
    - name: Run tests
      run: cargo nextest run --workspace --no-fail-fast
    - name: Run doctests
      run: cargo test --workspace --doc
  test-runtime:
    name: Test (runtime feature gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Reclaim runner disk space
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        sudo docker image prune -af || true

        '
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: build-essential clang cmake libbz2-dev libclang-dev liblz4-dev librocksdb-dev
          libsnappy-dev libssl-dev libzstd-dev pkg-config zlib1g-dev
        version: 1.0
    - uses: dtolnay/rust-toolchain@stable
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.7
      continue-on-error: true
    - name: Enable sccache (best-effort)
      run: "if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null;\
        \ then\n  echo \"RUSTC_WRAPPER=sccache\" >> \"$GITHUB_ENV\"\n  echo \"SCCACHE_GHA_ENABLED=true\"\
        \ >> \"$GITHUB_ENV\"\n  echo \"::notice::sccache enabled\"\nelse\n  echo \"\
        ::warning::sccache unavailable — falling back to direct compilation\"\nfi\n"
    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest
    - name: Cache cargo registry & git
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-runtime
    # F-NEW-3 root cause: integration tests behind `--features runtime` (and
    # the neo-tests consensus integration crate) never ran in CI, letting a
    # C#-contradicting assertion live for 40 days. This lane executes them.
    - name: Run neo-core runtime-gated tests
      run: cargo nextest run -p neo-core --features runtime --no-fail-fast
    - name: Run consensus integration tests
      run: cargo nextest run -p neo-tests --no-fail-fast
    - name: Run neo-rpc server tests
      run: cargo nextest run -p neo-rpc --features server --no-fail-fast
  fuzz-smoke:
    name: Fuzz (libFuzzer smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Reclaim runner disk space
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        sudo docker image prune -af || true

        '
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev llvm-dev liblz4-dev librocksdb-dev libssl-dev pkg-config
    - uses: dtolnay/rust-toolchain@nightly
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked
    - name: Cache cargo registry & git
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-fuzz
    # Coverage-guided fuzzing cannot run on windows-gnullvm hosts (no
    # sanitizer/sancov support), so the bounded smoke lane lives here.
    # Local Windows verification (uninstrumented) is documented in
    # outputs/audit-v017-final-report.md §5 E2.
    - name: Build fuzz targets (optimized + sancov)
      working-directory: fuzz
      run: cargo fuzz build --release
    - name: Fuzz transaction parse (60s)
      working-directory: fuzz
      run: cargo fuzz run fuzz_transaction_parse --release -- -max_total_time=60 -rss_limit_mb=2560
    - name: Fuzz script parse (60s)
      working-directory: fuzz
      run: cargo fuzz run fuzz_script_parse --release -- -max_total_time=60 -rss_limit_mb=2560
    - name: Fuzz message parse (60s)
      working-directory: fuzz
      run: cargo fuzz run fuzz_message_parse --release -- -max_total_time=60 -rss_limit_mb=2560
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crash-artifacts
        path: |
          fuzz/crash-*
          fuzz/artifacts/
        if-no-files-found: ignore
  windows-msvc:
    name: Windows MSVC Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-windows-msvc
    - name: Build neo-node
      run: cargo build --release --locked -p neo-node
  node-full:
    name: Node Full-Feature Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Reclaim runner disk space
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        sudo docker image prune -af || true

        '
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: build-essential clang cmake libbz2-dev libclang-dev liblz4-dev librocksdb-dev
          libsnappy-dev libssl-dev libzstd-dev pkg-config zlib1g-dev
        version: 1.0
    - uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry & git
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-node-full
    # R21: the full-node feature set (RocksDB provider included) must stay
    # compilable and tested; the default-feature test job never builds it.
    - name: Check neo-node with full features
      run: cargo check --locked -p neo-node --features full
    - name: Test neo-core with full features
      run: cargo test --locked -p neo-core --features full --lib
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Reclaim runner disk space
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        sudo docker image prune -af || true

        '
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: build-essential clang cmake libbz2-dev libclang-dev liblz4-dev librocksdb-dev
          libsnappy-dev libssl-dev libzstd-dev pkg-config zlib1g-dev
        version: 1.0
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88"
    - name: Cache cargo registry & git
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-msrv
    # R14: enforce the declared rust-version with a dedicated lane; stable-only
    # CI hides lockfile/dependency MSRV breakage.
    - name: Check workspace with declared MSRV
      run: cargo check --locked --workspace
  features:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Review §4.3.3: optional production capabilities must stay
        # compilable; default-feature CI alone never builds them.
        features:
        - "neo-node --features tee"
        - "neo-node --features hsm"
        - "neo-node --features full,tee,hsm"
    steps:
    - uses: actions/checkout@v4
    - name: Reclaim runner disk space
      run: 'sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

        sudo docker image prune -af || true

        '
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: build-essential clang cmake libbz2-dev libclang-dev liblz4-dev librocksdb-dev
          libsnappy-dev libssl-dev libzstd-dev pkg-config zlib1g-dev
        version: 1.0
    - uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo registry & git
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ci-features
    - name: Check optional feature set
      run: cargo check --locked -p ${{ matrix.features }}

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    # Hard gate. Previously soft-gated (continue-on-error) while a local-vs-CI delta
    # was undiagnosed; that delta was caused by deny.toml never having been committed,
    # so CI was failing on a 404 rather than on a real policy violation. With the file
    # committed the run produces no failure annotations, so the gate is restored --
    # a soft gate proves nothing and must not be counted as a passing check.
    - name: cargo deny (licenses, bans, sources)
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
        arguments: licenses bans sources
    - name: cargo deny (advisories)
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
        arguments: advisories

  protocol-consistency-goldens:
    name: Protocol consistency goldens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Verify C# state-root goldens against live seed
      run: python scripts/verify-protocol-consistency.py verify-goldens-online --reference http://seed1.neo.org:10332
    - name: Verify protocol presets against live MainNet/TestNet seeds
      # Audit P0-4 (2026-09-08): the preset reconciliation script was the only
      # true C#-parity check for the consensus constants migrated to neo-config,
      # but it was not wired into CI. Run it as a hard gate on every push/PR.
      run: python scripts/verify-protocol-presets.py

  native-parity:
    name: Native contract parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # Hard gate on the completeness question: every native contract method exposed by
    # the C# v3.10.1 reference must exist under the same name in the Rust node, and no
    # extra method may be exposed. Test suites cannot answer this -- they only cover
    # behaviour someone thought to write a test for -- so the surface itself is diffed.
    - name: Verify native contract method parity against C# v3.10.1
      run: python scripts/verify-native-parity.py --json reports/native-parity.json
    - name: Upload parity report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-parity-report
        path: reports/native-parity.json
        if-no-files-found: ignore
