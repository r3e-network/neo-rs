name: Neo v3.10.1 Consistency
on:
  push:
    branches:
    - main
    - master
    paths:
    - .github/workflows/compatibility-v310.yml
    - scripts/validate-v310-consistency.sh
    - Cargo.lock
    - Cargo.toml
    - neo-blockchain/**
    - neo-checkpoint/**
    - neo-config/**
    - neo-consensus/**
    - neo-crypto/**
    - neo-error/**
    - neo-execution/**
    - neo-indexer/**
    - neo-io/**
    - neo-manifest/**
    - neo-mempool/**
    - neo-native-contracts/**
    - neo-network/**
    - neo-node/**
    - neo-oracle-service/**
    - neo-payloads/**
    - neo-primitives/**
    - neo-rpc/**
    - neo-runtime/**
    - neo-serialization/**
    - neo-state-service/**
    - neo-static-files/**
    - neo-storage/**
    - neo-system/**
    - neo-vm/**
    - neo-wallets/**
  pull_request:
    branches:
    - main
    - master
    paths:
    - .github/workflows/compatibility-v310.yml
    - scripts/validate-v310-consistency.sh
    - Cargo.lock
    - Cargo.toml
    - neo-blockchain/**
    - neo-checkpoint/**
    - neo-config/**
    - neo-consensus/**
    - neo-crypto/**
    - neo-error/**
    - neo-execution/**
    - neo-indexer/**
    - neo-io/**
    - neo-manifest/**
    - neo-mempool/**
    - neo-native-contracts/**
    - neo-network/**
    - neo-node/**
    - neo-oracle-service/**
    - neo-payloads/**
    - neo-primitives/**
    - neo-rpc/**
    - neo-runtime/**
    - neo-serialization/**
    - neo-state-service/**
    - neo-static-files/**
    - neo-storage/**
    - neo-system/**
    - neo-vm/**
    - neo-wallets/**
  schedule:
  - cron: 0 */12 * * *
  workflow_dispatch:
    inputs:
      network:
        description: Network to validate
        required: false
        type: choice
        options:
        - all
        - mainnet
        - testnet
        default: all
      skip_baseline:
        description: Skip C# vs NeoGo baseline check
        required: false
        type: boolean
        default: false
      profile:
        description: Cargo profile
        required: false
        type: choice
        options:
        - dev
        - release
        default: dev
permissions:
  contents: read
jobs:
  consistency:
    name: ${{ matrix.network }} consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        network:
        - mainnet
        - testnet
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Install system dependencies
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\
        \n  build-essential \\\n  clang \\\n  cmake \\\n  curl \\\n  jq \\\n  libbz2-dev\
        \ \\\n  libclang-dev \\\n  liblz4-dev \\\n  libsnappy-dev\
        \ \\\n  libssl-dev \\\n  libzstd-dev \\\n  pkg-config \\\n  python3 \\\n \
        \ python3-pip \\\n  python3-venv \\\n  zlib1g-dev\n"
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
      with:
        toolchain: 1.89.0
    - name: Cache cargo
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
    - name: Run Neo v3.10.1 consistency validation
      env:
        TARGET_NETWORK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.network
          || 'all' }}
        PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile
          || 'dev' }}
        SKIP_BASELINE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_baseline
          || 'false' }}
        VECTOR_GAS_TOLERANCE: 1000000
      # The validator distinguishes two kinds of non-zero exit, and so must we:
      #
      #   1  a parity MISMATCH -- neo-rs disagrees with the reference. A real
      #      failure; must go red.
      #   75 REFERENCE-UNREACHABLE -- no live C#/NeoGo seed was reachable, so
      #      parity was never evaluated. Says nothing about neo-rs.
      #
      # Retry 3x first, since reachability is often transient (the build is
      # cached, so a retry only re-runs the validator). If all three attempts
      # still come back 75, the runner simply has no route to the seeds -- GitHub
      # runners are frequently blocked by them. Reporting that as a build failure
      # is what left this workflow red for ten consecutive runs, which in turn
      # means an actual mismatch would have been indistinguishable from the
      # ambient red. So 75 surfaces as a loud warning and leaves the lane green;
      # anything else still fails.
      run: |
        if [ "$TARGET_NETWORK" != "all" ] && [ "$TARGET_NETWORK" != "${{ matrix.network }}" ]; then
          echo "Skipping matrix lane '${{ matrix.network }}' for requested network '$TARGET_NETWORK'"
          exit 0
        fi
        args=(--network "${{ matrix.network }}" --profile "$PROFILE")
        if [ "$SKIP_BASELINE" = "true" ]; then
          args+=(--skip-baseline)
        fi
        rc=1
        for attempt in 1 2 3; do
          echo "=== consistency attempt $attempt/3 ==="
          if bash scripts/validate-v310-consistency.sh "${args[@]}"; then
            rc=0
            break
          else
            rc=$?
            echo "attempt $attempt failed (rc=$rc)" >&2
          fi
          # 76 is a deterministic property of the live chain's fee policy, not a
          # flaky endpoint. Retrying re-runs the whole vector suite for the same
          # answer, so stop here.
          [ "$rc" -eq 76 ] && break
          [ "$attempt" -lt 3 ] && sleep 15
        done

        if [ "$rc" -eq 75 ]; then
          msg="${{ matrix.network }}: parity NOT EVALUATED -- no C#/NeoGo reference seed reachable from this runner after 3 attempts. This is not a parity result."
          echo "::warning title=v3.10.1 consistency not evaluated::$msg"
          {
            echo "### :warning: ${{ matrix.network }} consistency not evaluated"
            echo
            echo "No live C#/NeoGo reference seed was reachable from the runner after 3 attempts,"
            echo "so parity was never compared. This is **not** a mismatch, and **not** evidence"
            echo "of parity either. A genuine mismatch exits 1 and fails this lane."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        if [ "$rc" -eq 76 ]; then
          msg="${{ matrix.network }}: neo-rs parity checks passed; the C#-vs-NeoGo baseline was NOT EVALUATED because the live chain's ExecFeeFactor differs from the value the execution-spec vectors price opcodes at."
          echo "::warning title=v3.10.1 baseline not comparable::$msg"
          {
            echo "### :warning: ${{ matrix.network }} baseline not comparable"
            echo
            echo "The neo-rs protocol-parity and vector-diff checks ran and passed. Only the"
            echo "C#-vs-NeoGo baseline cross-check was skipped: the execution-spec vectors price"
            echo "opcodes at the genesis default \`ExecFeeFactor\`, and both live networks have"
            echo "voted theirs to a different value. Every gas figure would then differ by that"
            echo "ratio against C# and NeoGo *identically*, which is a fee-policy difference"
            echo "rather than an implementation one. A genuine mismatch exits 1 and fails this lane."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        exit "$rc"
    - name: Upload consistency artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: v310-consistency-${{ matrix.network }}
        path: 'reports/compat-v310/**

          '
        retention-days: 14
