\* neo-rs dBFT - SAFE config, real constants for n=7.
\*   f = (n-1)/3 = 2,  M = n - f = 5   (context/mod.rs f()/m())
\*   Safety bound: 2*M - n = 3 > f=2  -> Agreement must hold.
CONSTANT n = 7
CONSTANT f = 2
CONSTANT M = 5
CONSTANT Block = {b1, b2}
SPECIFICATION Spec
INVARIANT Agreement
INVARIANT QuorumRespected