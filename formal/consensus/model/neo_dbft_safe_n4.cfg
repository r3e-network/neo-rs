\* neo-rs dBFT - SAFE config, real constants for n=4.
\*   f = (n-1)/3 = 1,  M = n - f = 3   (context/mod.rs f()/m())
\*   Safety bound: 2*M - n = 2 > f=1  -> Agreement must hold.
CONSTANT n = 4
CONSTANT f = 1
CONSTANT M = 3
CONSTANT Block = {b1, b2}
SPECIFICATION Spec
INVARIANT Agreement
INVARIANT QuorumRespected