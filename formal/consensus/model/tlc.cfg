## 🚀 Automated Testing Integration

### GitHub Actions Integration Example

```yaml
- name: TLC Model Check - Healthy Config
  run: |
    cd formal/consensus/model
    tlc node.tla -config tlc.cfg -param "n=4" -param "f=1"
    
- name: TLC Model Check - Unhealthy Config
  run: |
    cd formal/consensus/model
    tlc node.tla -config tlc.cfg -param "n=3" -param "f=1" --checkInvariants=no
    
- name: Parse Results
  run: python scripts/formal-verification/parse_tlc_results.py
```

