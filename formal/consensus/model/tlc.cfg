# TLC Model Checker Configuration for Neo-N3 Consensus Protocol

**Model**: consensus.model.node  
**Configuration Version**: 1.0.0  

---

## ⚙️ Core Parameters

```tla
(* File: formal/consensus/model/tlc.cfg *)

# Basic settings
Depth = 15                    # Maximum exploration depth (covers ~2 view changes)
NumWorkers = 8                # Parallel threads for state space search
TimeLimit = 3600              # 1 hour timeout per configuration
CheckLinks = Yes              # Verify next-state relation connectivity

# State space options
MaxStates = 40000000          # 40M states max before aborting
MaxPaths = 0                  # 0 = explore all paths (unlimited)

# Histogram generation
HistConfigFile = hist.ini     # Custom histogram configuration

# Error reporting
ShowExecHistory = Yes         # Display execution history in errors
StopOnErr = Yes               # Stop immediately on first error

# Parameterization
CONSTANTS n = 4, f = 1        # Default: healthy Byzantine threshold

# Additional invariants to check
AdditionalInvariants = 
    Agreement,                # All honest nodes commit same block
    Validity,                 # Committed block proposed by honest leader
    NoDoubleCommit,           # Never commit different blocks at same height
    FaultToleranceBound,      # |FaultyNodes| <= f
    PreparedThreshold,        # Need 2f+1 PREPARE messages
    CommitThreshold,          # Need 2f+1 COMMIT messages
    ReplyAfterCommit          # Only send REPLY after commit

# Custom checker configurations
```

---

## 📊 Test Configuration Scenarios

### Scenario 1: Healthy System (n=4, f=1)
**Expected Result**: ✅ All safety invariants hold

```properties
n = 4
f = 1
```

This satisfies `n >= 3*f + 1` => `4 >= 4` ✓  
Model checker should complete without counterexamples.

---

### Scenario 2: Unhealthy System (n=3, f=1)
**Expected Result**: ❌ Agreement invariant violated

```properties
n = 3
f = 1
```

Violates `n >= 3*f + 1` => `3 >= 4` ✗  
TLC will produce counterexample showing two honest nodes committing different blocks.

---

### Scenario 3: Stress Test (n=7, f=2)
**Expected Result**: ✅ Holds (but slower due to larger state space)

```properties
n = 7
f = 2
```

Satisfies `7 >= 3*2 + 1` => `7 >= 7` ✓  
Requires more computation but should verify successfully.

---

## 🎯 Property Validation Strategy

### Primary Safety Properties (Critical - Must Hold)

1. **Agreement**: No fork among honest nodes
2. **Validity**: Only valid proposals get committed
3. **NoDoubleCommit**: Atomic commitment guarantee

### Secondary Properties (Important - Should Hold)

4. **FaultToleranceBound**: Enforced by protocol design
5. **PreparedThreshold**: Requires quorum size
6. **CommitThreshold**: Ensures consistency

### Liveness Properties (Advanced - Timing Required)

7. **Termination**: Progress under partial synchrony
   *Note: Full liveness requires integrating TLA+ timing modules*

