\* neo-rs dBFT - BOUNDARY config (quorum too small).
\*   n=4, f=2, M=2:  two quorums of size 2 need not intersect in > f=2 honest
\*   nodes.  Safety bound 2*M - n = 0 <= f  -> Agreement SHOULD be violated
\*   (this is exactly the failure mode the real f=(n-1)/3, M=n-f avoids).
CONSTANT n = 4
CONSTANT f = 2
CONSTANT M = 2
CONSTANT Block = {b1, b2}
SPECIFICATION Spec
INVARIANT Agreement
INVARIANT QuorumRespected