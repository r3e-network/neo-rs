# Dedicated MainNet sync for fail-closed C#↔Rust state-root verification.
# See docs/PROTOCOL_CONSISTENCY.md

[network]
network_type = "MainNet"
network_magic = 0x334F454E

[storage]
backend = "rocksdb"
path = "./data/mainnet-protocol-consistency"
read_only = false

[p2p]
port = 10333
max_connections = 50
min_desired_connections = 10
seed_nodes = [
    "seed1.neo.org:10333",
    "seed2.neo.org:10333",
    "seed3.neo.org:10333",
    "seed4.neo.org:10333",
    "seed5.neo.org:10333"
]
enable_compression = true
broadcast_history_limit = 100000

[rpc]
enabled = true
port = 10332
bind_address = "127.0.0.1"
cors_enabled = false
auth_enabled = false
max_gas_invoke = 50000000
max_iterator_results = 100
disabled_methods = ["openwallet"]

[consensus]
enabled = false
auto_start = false

[telemetry]
[telemetry.metrics]
enabled = false

[logging]
level = "info"
format = "json"
file_path = "./logs/neo-node-protocol-consistency.log"
max_file_size = "100MB"
max_files = 20

[blockchain]
block_time = 15000
max_transactions_per_block = 512

[mempool]
max_transactions = 50000

[state_service]
enabled = true
full_state = true
path = "StateRoot"
