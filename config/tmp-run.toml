[network]
network_type = "MainNet"
network_magic = 0x334F454E

[storage]
backend = "rocksdb"
path = "./data/tmp-run"
read_only = false

[p2p]
port = 10346
max_connections = 50
min_desired_connections = 0
seed_nodes = []
enable_compression = true
broadcast_history_limit = 100000

[rpc]
enabled = false
port = 10347
bind_address = "127.0.0.1"
cors_enabled = false
auth_enabled = false
max_gas_invoke = 50000000
max_iterator_results = 100
disabled_methods = ["openwallet"]

[consensus]
enabled = false
auto_start = false

[telemetry]
[telemetry.metrics]
enabled = false

[logging]
level = "info"
format = "json"
file_path = "./logs/tmp-run.log"
max_file_size = "100MB"
max_files = 4

[blockchain]
block_time = 15000
max_transactions_per_block = 512

[mempool]
max_transactions = 50000

[state_service]
enabled = true
full_state = true
path = "StateRoot"
