# Full MainNet validation node for the [0, H] fail-closed state-root campaign.
#
# Purpose:
#   * Bootstrap a FRESH data directory from the official N3 chain dump
#     (`chain.0.acc.zip` -> `chain.0.acc`) via `neo-node --import-acc --import-only`.
#   * Serve `getstateroot` over RPC so `scripts/mainnet-full-verify.py` can compare
#     every executed height against the C# reference node (seed1.neo.org:10332).
#
# This file is intentionally SEPARATE from `mainnet-protocol-consistency.toml`
# (which owns the older, partially-synced `./data/mainnet-protocol-consistency`
# directory). Do NOT point this config at that directory.

[network]
network_type = "MainNet"
network_magic = 0x334F454E

[storage]
backend = "rocksdb"
path = "./data/mainnet-full-validation"
read_only = false

[p2p]
# Distinct from protocol-consistency (10333) so both databases can coexist.
port = 10343
max_connections = 50
min_desired_connections = 10
seed_nodes = [
    "seed1.neo.org:10333",
    "seed2.neo.org:10333",
    "seed3.neo.org:10333",
    "seed4.neo.org:10333",
    "seed5.neo.org:10333"
]
enable_compression = true
broadcast_history_limit = 100000

[rpc]
enabled = true
port = 10332
bind_address = "127.0.0.1"
cors_enabled = false
auth_enabled = false
max_gas_invoke = 50000000
max_iterator_results = 100
disabled_methods = ["openwallet"]

[consensus]
enabled = false
auto_start = false

[telemetry]
[telemetry.metrics]
enabled = false

[logging]
level = "info"
format = "json"
file_path = "./logs/neo-node-mainnet-full.log"
max_file_size = "100MB"
max_files = 20

[blockchain]
block_time = 15000
max_transactions_per_block = 512

[mempool]
max_transactions = 50000

[state_service]
enabled = true
full_state = true
path = "StateRoot"
