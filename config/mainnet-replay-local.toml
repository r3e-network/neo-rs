# Task 51: continue the full MainNet block replay from the official ACC package
# at maximum import speed on top of the existing (partially imported) store.
#
# Purpose:
#   * Resume `neo-node --import-acc ... --import-only` from ~6.1M persisted
#     blocks up to the package end (0..13141250, 13,141,251 blocks).
#   * Replay every block through the canonical VM executor with the fast-path
#     optimization enabled (`mode = "auto"`), but serial commit order
#     (`parallel_enabled = false`) so the resume stays deterministic.
#   * Keep persistence profiling OFF: it only adds clock/telemetry overhead and
#     cannot change results.
#   * Keep application logs and the state service ON so the resumed heights can
#     still be checked against the C# reference.
#
# Schema note: `NodeConfig` is `#[serde(default, deny_unknown_fields)]`, so only
# keys defined in `neo-node/src/config/sections.rs` may appear here.
# `[storage.prefetch]` is intentionally absent: absent means disabled.

[network]
network_type = "MainNet"
network_magic = 860833102

[storage]
backend = "rocksdb"
path = "D:/Git/neo-rs/data/mainnet-replay-fresh"
read_only = false

# Fast-path execution (mode = "auto"), serial commit order, no profiling
# telemetry overhead.
[execution]
mode = "auto"
profiling = false
parallel_enabled = false

# Distinct from the other MainNet profiles (10333 / 10343) so this database can
# coexist with the full-validation and protocol-consistency nodes.
[p2p]
listen_port = 10343
seed_nodes = [
    "seed1.neo.org:10333",
    "seed2.neo.org:10333",
    "seed3.neo.org:10333",
    "seed4.neo.org:10333",
    "seed5.neo.org:10333"
]

[rpc]
enabled = true
bind_address = "127.0.0.1"
port = 10342
auth_enabled = false

# State service owns its own database; keep it out of the chain database
# directory so two RocksDB instances never share a path.
[state_service]
enabled = true
full_state = true
auto_verify = false
path = "D:/Git/neo-rs/data/mainnet-replay-fresh/StateRoot"

[logging]
level = "info"
format = "json"
console_output = true
file_enabled = true
file_path = "D:/Git/neo-rs/logs/mainnet-replay-fresh.log"

[application_logs]
enabled = true
path = "D:/Git/neo-rs/data/mainnet-replay-fresh/ApplicationLogs"

[tokens_tracker]
enabled = false

[oracle_service]
enabled = false

[dbft]
enabled = false
