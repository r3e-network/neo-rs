# Live Neo N3 MainNet node.
# P2P joins the public network. RPC stays on localhost.
# State roots are calculated for the current trie. Historical trie nodes are not kept.

[network]
network_type = "MainNet"
network_magic = 0x334F454E

[storage]
backend = "rocksdb"
path = "./data/live-mainnet"

[p2p]
port = 10333
max_connections = 40
min_desired_connections = 10
seed_nodes = [
    "seed1.neo.org:10333",
    "seed2.neo.org:10333",
    "seed3.neo.org:10333",
    "seed4.neo.org:10333",
    "seed5.neo.org:10333",
]
enable_compression = true

[rpc]
enabled = true
port = 10332
bind_address = "127.0.0.1"
cors_enabled = false
auth_enabled = false
max_gas_invoke = 50000000
max_iterator_results = 100
disabled_methods = ["openwallet"]

[consensus]
enabled = false
auto_start = false

[logging]
level = "info"
format = "json"
console_output = false
file_enabled = true
file_path = "./logs/live-mainnet.log"
max_file_size = "100MB"
max_files = 10

[blockchain]
block_time = 15000
max_transactions_per_block = 512

[state_service]
enabled = true
full_state = false
path = "StateRoot"

# Leftover plugin JSON under data/Plugins must not attach these to a sync.
[application_logs]
enabled = false

[tokens_tracker]
enabled = false

[mempool]
max_transactions = 50000
