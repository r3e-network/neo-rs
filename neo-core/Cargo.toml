[package]
name = "neo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Core functionality for Neo blockchain"

[dependencies]
# External dependencies
num-bigint = { workspace = true }
num-traits = { workspace = true }
num-integer = "0.1"
thiserror = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
byteorder = { workspace = true }
bytes = { workspace = true }
# tokio kept for persistence/backup modules
# Consider moving these to neo-node in future refactoring
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "rt"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
async-trait = { workspace = true }
rand = { workspace = true }
# sha2, sha3, blake2, ripemd removed - use neo-crypto instead
bs58 = { workspace = true }
bip39 = { workspace = true }
# secp256k1, ed25519-dalek removed - use neo-crypto instead
blst = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }
quick-xml = { version = "0.31", features = ["serialize"], optional = true }
uuid = { workspace = true }
base64 = { workspace = true }
murmur3 = { workspace = true }
rocksdb = { workspace = true, optional = true }
url = { workspace = true }
percent-encoding = "2.3"
scrypt = "0.11"
parking_lot = { workspace = true }
lz4_flex = { workspace = true }
dashmap = { workspace = true }
hashbrown = { workspace = true }
memchr = { workspace = true }
toml = { workspace = true }
dirs = "5.0"
bitflags = { workspace = true }
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
zeroize = { workspace = true }
subtle = { workspace = true }

# Task W3-C2: rayon, indexmap, lru, governor, fastbloom, bitvec and if-addrs
# moved to `neo-system` together with the P2P/blockchain actors that used them.

# Cross-thread communication for parallel pipeline
crossbeam-channel = "0.5"
num_cpus = "1.15"

# Internal dependencies
chrono.workspace = true
futures.workspace = true
futures-util = "0.3"
anyhow.workspace = true
neo-vm = { workspace = true }
neo_io_crate = { path = "../neo-io", package = "neo-io" }
inventory = "0.3"
neo-json = { path = "../neo-json" }
log = "0.4"

# New foundation crates (re-exported for backward compatibility)
# Foundation layer dependencies only (Layer 0)
# NOTE: neo-consensus removed to fix layering violation
neo-p2p = { path = "../neo-p2p" }
neo-protocol = { workspace = true }
neo-config = { workspace = true }
neo-primitives = { path = "../neo-primitives" }
neo-crypto = { path = "../neo-crypto" }
neo-storage = { path = "../neo-storage" }
neo-native-contracts = { workspace = true }
neo-smart-contract = { workspace = true }
# Task 173 (B2): authoritative wallet primitives. neo-core/src/wallets re-exports
# the collapsible leaf modules (bip32, bip39, transfer_output) from here.
neo-wallets = { workspace = true }
neo-state-service = { workspace = true }
# Task 194: authoritative generic actor runtime. neo-core/src/actors was removed;
# `pub use neo_actors as actors`/`as runtime` re-exports it under the `runtime`
# feature. Frozen transition edge until the runtime wiring leaves neo-core.
neo-actors = { workspace = true }
# Task 179 (C-1): authoritative memory pool. neo-core/src/ledger re-exports the
# `memory_pool` module from here; the local copy was removed.
neo-mempool = { workspace = true }
# Task 180 (C-2): authoritative block validation rules. neo-core/src/validation.rs
# was removed; callers bind to `neo_ledger::validation::rules` instead.
neo-ledger = { workspace = true }
xxhash-rust = { workspace = true }
unicode-segmentation = "1.10"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# For cryptography tests that need direct secp256k1 access
secp256k1 = { workspace = true }

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "storage"
harness = false

[features]
default = []
# RocksDB storage provider - enable for production use
rocksdb = ["dep:rocksdb", "neo-storage/rocksdb"]
# UPnP network discovery - requires reqwest
upnp = ["dep:reqwest", "dep:quick-xml"]
# Oracle service - requires reqwest.
# The NeoFS transport (REST + gRPC) now lives in `neo-oracle`, which owns its
# own `neofs-grpc` feature, tonic/prost deps and proto codegen build script.
oracle = ["dep:reqwest"]
# Parallel processing for bulk sync (rayon is always available)
parallel = []
# Account prefetch cache (Solana-inspired optimization) - requires runtime
prefetch = ["runtime", "neo-state-service/prefetch"]
# All optional features for full functionality
full = ["rocksdb", "upnp", "oracle", "parallel"]
runtime = ["neo-state-service/runtime"]
performance-tests = []
# VM object pooling for high-throughput transaction processing
pooled-engine = []

