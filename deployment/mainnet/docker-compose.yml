version: '3.8'

services:
  neo-node:
    build:
      context: ../..
      dockerfile: deployment/mainnet/Dockerfile
    container_name: neo-mainnet-node
    restart: unless-stopped

    ports:
      - "10333:10333"  # P2P
      - "127.0.0.1:10332:10332"  # RPC (localhost only)
      - "127.0.0.1:9090:9090"  # Metrics (localhost only)

    volumes:
      - neo-data:/opt/neo-node/data
      - neo-logs:/opt/neo-node/logs
      - ./config/mainnet-production.toml:/opt/neo-node/config/mainnet-production.toml:ro

    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1

    networks:
      - neo-network

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 16G

    # Security
    security_opt:
      - no-new-privileges:true

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10332", "-d", '{"jsonrpc":"2.0","method":"getblockcount","params":[],"id":1}']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: neo-prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9091:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

    networks:
      - neo-network

    depends_on:
      - neo-node

  grafana:
    image: grafana/grafana:latest
    container_name: neo-grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/neo-node-dashboard.json:/etc/grafana/provisioning/dashboards/neo-node.json:ro

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=CHANGE_ME
      - GF_USERS_ALLOW_SIGN_UP=false

    networks:
      - neo-network

    depends_on:
      - prometheus

volumes:
  neo-data:
    driver: local
  neo-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  neo-network:
    driver: bridge
