# Neo N3 MainNet Node Configuration
# Professional production-ready configuration

[network]
network_magic = 0x334F454E  # MainNet magic number

[storage]
backend = "rocksdb"
data_dir = "./data/mainnet"
read_only = false

[p2p]
port = 10333
max_connections = 100
min_desired_connections = 10
seed_nodes = [
    "seed1.neo.org:10333",
    "seed2.neo.org:10333",
    "seed3.neo.org:10333",
    "seed4.neo.org:10333",
    "seed5.neo.org:10333"
]
enable_compression = true
broadcast_history_limit = 100000

[rpc]
enabled = true
port = 10332
bind_address = "127.0.0.1"
cors_enabled = false
auth_enabled = false
max_gas_invoke = 50000000
max_iterator_results = 100
disabled_methods = ["openwallet"]

# Rate Limiting (DoS Protection)
# Prevents request flooding by limiting requests per IP address
# Set max_requests_per_second = 0 to disable (not recommended for public nodes)
max_requests_per_second = 100  # Maximum sustained requests per second per IP
rate_limit_burst = 200          # Burst capacity for short spikes
# Note: Different RPC methods have different tier limits:
#   - Cheap (getblockcount, getversion): 2x standard rate
#   - Standard (getblock, gettransaction): standard rate
#   - Expensive (invokefunction, invokescript): 1/5 standard rate
#   - Write (sendrawtransaction): 1/10 standard rate

[consensus]
enabled = false
auto_start = false

[telemetry]
[telemetry.metrics]
enabled = false
port = 9090
bind_address = "127.0.0.1"

[logging]
level = "info"
format = "json"
file_path = "./logs/neo-node-mainnet.log"
max_file_size = "100MB"
max_files = 10

[blockchain]
block_time = 15000  # 15 seconds in milliseconds
max_transactions_per_block = 512

[mempool]
max_transactions = 50000

# Enable StateService so fresh sync populates the state-root MPT trie that
# `mainnet_state_roots_vs_csharp` bulk-test reads from. Path is absolute
# (`data/mainnet/StateRoot`) so it matches the existing 812MB clean-data
# layout used by all the mainnet_block_*_repro tests.
[state_service]
enabled = true
full_state = true
path = "../mainnet/StateRoot"

# Wave 4-5: Predictive Storage Prefetch + Tiered MPT Cache [PERFORMANCE]
[performance.predictive_prefetch]
enabled = true
prediction_window_blocks = 10
hot_keys_per_block = 800  # Higher for mainnet workload
prefetch_batch_size = 200
prefetch_worker_threads = 4  # More threads for production

[performance.tiered_cache]
tier0_capacity = 512              # Larger root branch buffer for mainnet
tier1_capacity = 100000           # Hot native leaves (NEO/GAS/Policy)
tier2_max_prefixes = 5000000      # Contract prefixes
tier3_lru_size_mb = 512           # General fallback (larger memory budget)
