[package]
name = "neo-oracle"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Oracle service implementation for Neo N3 nodes"
license = "MIT"
build = "build.rs"

# Inherit the workspace-wide clippy/rustc lint policy (audit-confirmed gap:
# this was the only workspace member without this hookup).
[lints]
workspace = true

[dependencies]
# Internal crates (registered in workspace.dependencies)
neo-primitives = { workspace = true }
neo-protocol = { workspace = true }
neo-crypto = { workspace = true }
neo-io = { workspace = true }
neo-json = { workspace = true }
neo-wallets = { workspace = true }
neo-vm = { workspace = true }
neo-smart-contract = { workspace = true }

# Third-party (registered in workspace.dependencies)
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
# No matching [workspace.dependencies] entry; kept inline on purpose.
percent-encoding = "2.3"
rand = { workspace = true }
# The workspace entry carries json/blocking/stream/gzip; this crate only needs
# json+stream, but features unify workspace-wide so the superset is accepted.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }

# NeoFS gRPC transport (optional, mirrors neo-core's `neofs-grpc` feature gate).
# No [workspace.dependencies] entries for tonic/prost; kept inline on purpose.
tonic = { version = "0.13", features = ["transport", "tls-ring", "tls-webpki-roots"], optional = true }
prost = { version = "0.13", optional = true }

[build-dependencies]
# NOTE: These are only used when the `neofs-grpc` feature is enabled (build.rs
# checks CARGO_FEATURE_NEOFS_GRPC). Cargo does not support feature-gating
# build-deps, so they are always compiled.
tonic-build = "0.13"
protoc-bin-vendored = "3.0"

[dev-dependencies]
bs58 = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[features]
default = []
# NeoFS gRPC support (optional, for parity with C# and neo-core).
neofs-grpc = ["dep:tonic", "dep:prost"]
# Aggregate gate so `neo-oracle` participates in the workspace-wide
# `--features full` build and the per-crate acceptance check.
full = ["neofs-grpc"]
