[package]
name = "neo-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Actor runtime and system adapters for neo-rs"

[features]
default = []
# Task 208: state root verification actor + wallet-changed handler moved from
# neo-core::state_service::verification. Enabled by consumers (neo-node) that
# register the verification service with the unified signer.
state-verifier = []
# Task W3-C2: moved P2P peer discovery UPnP transport support.
upnp = []
full = ["state-verifier", "upnp"]

[dependencies]
# Internal crates (registered in workspace.dependencies)
neo-primitives = { workspace = true }
# Task 208: state verification builds extensible-payload witness invocation
# scripts with VM opcodes (PUSHDATA1).
neo-vm = { workspace = true }

# Internal crates (not yet in workspace.dependencies; registered by task 89)
neo-ledger = { path = "../neo-ledger" }
neo-storage = { path = "../neo-storage" }
neo-crypto = { workspace = true }
neo-native-contracts = { workspace = true }

# Task D4: neo-system binds wallet primitives directly from neo-wallets.
neo-wallets = { workspace = true }

# Task 230 (D2 phase 1): authoritative CoreError/CoreResult live in
# neo-smart-contract; neo-system binds them directly instead of through the
# neo-core error re-export shim.
neo-smart-contract = { workspace = true }
# Wave D1-L1 (task 215): the moved node actors bind directly to the generic
# actor runtime instead of the neo-core `runtime` compatibility re-export
# (same types, TypeId-preserving).
neo-actors = { workspace = true }
# Shared caches (HashSetCache/RelayCache) used by the P2P actors. Bound under
# the historical `neo_io_crate` alias used throughout the moved code.
neo_io_crate = { path = "../neo-io", package = "neo-io" }
# Execution payload types used by the moved converters and unit tests.
neo-protocol = { workspace = true }

# Third-party
async-trait = { workspace = true }
bitvec = { workspace = true }
dashmap = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
if-addrs = "0.10"
indexmap = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
num-bigint = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
