[package]
name = "state-root-diff"
version = "0.1.0"
edition = "2021"

[dependencies]
neo-core = { path = "../../neo-core" }
neo-storage = { path = "../../neo-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }

[[bin]]
name = "rust-state-processor"
path = "rust_state_processor.rs"
