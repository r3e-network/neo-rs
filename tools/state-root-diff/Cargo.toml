[package]
license = "MIT"
name = "state-root-diff"
version = "0.1.0"
edition = "2021"

[dependencies]
neo-storage = { path = "../../neo-storage" }
neo-ledger = { path = "../../neo-ledger" }
neo-native-contracts = { path = "../../neo-native-contracts" }
neo-io.workspace = true
neo-system = { path = "../../neo-system" }
neo-primitives = { path = "../../neo-primitives" }
neo-protocol = { path = "../../neo-protocol" }
neo-json = { path = "../../neo-json" }
neo-rpc = { path = "../../neo-rpc", features = ["client"] }
neo-validator = { path = "../../neo-validator" }
neo-vm = { path = "../../neo-vm" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
clap = { version = "4.0", features = ["derive"] }
sysinfo.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "rust-state-processor"
path = "rust_state_processor.rs"

[[bin]]
name = "mainnet-state-verifier"
path = "mainnet_state_verifier.rs"

[[bin]]
name = "transfer-pattern-profiler"
path = "transfer_pattern_profiler.rs"

[lints]
workspace = true
