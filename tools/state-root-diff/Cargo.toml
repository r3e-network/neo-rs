[package]
license = "MIT"
name = "state-root-diff"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
neo-storage = { path = "../../neo-storage" }
neo-ledger = { path = "../../neo-ledger" }
neo-native-contracts = { path = "../../neo-native-contracts" }
neo-io.workspace = true
neo-system = { path = "../../neo-system" }
# Phase 1 S3: state-service surface bound directly from the extracted crate.
neo-state-service = { path = "../../neo-state-service" }
neo-primitives = { path = "../../neo-primitives" }
neo-protocol = { path = "../../neo-protocol" }
neo-json = { path = "../../neo-json" }
neo-rpc-client = { path = "../../neo-rpc-client" }
neo-smart-contract = { path = "../../neo-smart-contract" }
neo-validator = { path = "../../neo-validator" }
neo-vm = { path = "../../neo-vm" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
clap = { version = "4.0", features = ["derive"] }
sysinfo.workspace = true
# Read-only RocksDB access for the state-root sweep; the writable open path in
# neo-storage is deliberately not imported by that binary.
rocksdb = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "rust-state-processor"
path = "rust_state_processor.rs"

[[bin]]
name = "mainnet-state-verifier"
path = "mainnet_state_verifier.rs"

[[bin]]
name = "transfer-pattern-profiler"
path = "transfer_pattern_profiler.rs"

# Task 59: strictly read-only state-root sweep for external replay audits.
[[bin]]
name = "state-root-sweep"
path = "state_root_sweep.rs"

[lints]
workspace = true
