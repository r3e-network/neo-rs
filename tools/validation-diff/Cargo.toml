[package]
license = "MIT"
name = "validation-diff"
version = "0.1.0"
edition = "2021"

[dependencies]
neo-protocol = { path = "../../neo-protocol" }
neo-primitives = { path = "../../neo-primitives" }
neo-io = { path = "../../neo-io" }
neo-json = { path = "../../neo-json" }
neo-ledger = { path = "../../neo-ledger" }
neo-rpc = { path = "../../neo-rpc", features = ["client"] }
neo-vm = { path = "../../neo-vm" }
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }

[[bin]]
name = "rust-validator"
path = "rust_validator_cli.rs"

[lints]
workspace = true
